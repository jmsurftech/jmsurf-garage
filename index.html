    <!-- Loading screen while the app downloads; the crawler text in #root stays hidden (public/boot-guard.js). -->
    <style>
      #boot{display:none}
      .js #boot{display:flex;min-height:100vh;min-height:100dvh;flex-direction:column;align-items:center;justify-content:center;gap:16px;font:15px/1.5 system-ui,sans-serif;color:#555;background:#fff;text-align:center;padding:24px;box-sizing:border-box}
      .js.boot-failed #boot{min-height:0;padding:20px 16px;border-bottom:1px solid #ddd}
      .js.boot-failed .seo-pre{display:block}
      #boot img{border-radius:10px}
      #boot .boot-spin{width:36px;height:36px;border:3px solid #e5e5e5;border-top-color:var(--boot-c);border-radius:50%;animation:boot-spin .8s linear infinite}
      .boot-failed #boot .boot-spin{display:none}
      #boot .boot-msg{display:none}
      .boot-slow #boot .boot-msg,.boot-failed #boot .boot-msg{display:block}
      #boot p{margin:0 0 12px}
      #boot button{font:600 14px system-ui,sans-serif;background:var(--boot-c);color:#fff;border:0;border-radius:8px;padding:10px 18px;cursor:pointer}
      @media (prefers-color-scheme:dark){.js #boot{background:#0b0b0c;color:#aaa}.js #boot .boot-spin{border-color:#333;border-top-color:var(--boot-c)}.js.boot-failed #boot{border-color:#333}}
      @keyframes boot-spin{to{transform:rotate(360deg)}}
    </style>
  </head>

  <body>
    <!-- shopBrand.js swaps the logo on shop addresses. The Reload button works from boot-guard.js (no inline script). -->
    <div id="boot" role="status" aria-live="polite" style="--boot-c:#a8121b">
      <img id="boot-logo" src="/jm-icon-192.png?v=3" alt="JMSURF Garage" width="48" height="48" />
      <div class="boot-spin" aria-hidden="true"></div>
      <div class="boot-msg">
        <p>The page is taking longer than usual to load. Your connection may be slow.</p>
        <p><button type="button" data-boot-reload>Reload the page</button></p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
